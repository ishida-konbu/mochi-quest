<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#eae5d7" />
    <title>Mochi Quest 2 ｜ 四季十景巡り</title>
    <meta
      name="description"
      content="お餅になって、鳥獣戯画の里を歩く。雪の都から初日の出の浜まで、十の名所がつながる三次元のオープンワールド。"
    />
    <script>
      if (location.hash.startsWith('#mochi2=')) {
        window.pendingMochiJourney = location.hash;
        history.replaceState(history.state, '', location.pathname + location.search);
      }
      // Opening a transfer link while this game is already on screen can be
      // a same-document navigation. Run the usual validated startup in that case.
      window.addEventListener('hashchange', () => {
        if (location.hash.startsWith('#mochi2=')) location.reload();
      });
    </script>
    <link rel="icon" href="../assets/ui/seal.svg" />
    <link rel="stylesheet" href="./game.css?v=2.3" />
    <script type="importmap">
      {
        "imports": {
          "../sound.js": "../sound.js?v=2.3",
          "./soundscape.js": "./soundscape.js?v=2.3",
          "./festival.js": "./festival.js?v=2.3",
          "./mochi-pounding.js": "./mochi-pounding.js?v=2.3",
          "./seasons.js": "./seasons.js?v=2.3",
          "./meadow-layout.js": "./meadow-layout.js?v=2.3",
          "./meadow.js": "./meadow.js?v=2.3",
          "./forest.js": "./forest.js?v=2.3",
          "./forest-forms.js": "./forest-forms.js?v=2.3",
          "./forest-mesh.js": "./forest-mesh.js?v=2.3",
          "./procession-view.js": "./procession-view.js?v=2.3",
          "./procession.js": "./procession.js?v=2.3",
          "./trade-tools.js": "./trade-tools.js?v=2.3",
          "./map.js": "./map.js?v=2.3",
          "./mochi-model.js": "./mochi-model.js?v=2.3",
          "./resident-art.js": "./resident-art.js?v=2.3",
          "./wilds.js": "./wilds.js?v=2.3",
          "./atmosphere.js": "./atmosphere.js?v=2.3",
          "./pigments.js": "./pigments.js?v=2.3",
          "./spring-water.js": "./spring-water.js?v=2.3",
          "./places.js": "./places.js?v=2.3",
          "./actors.js": "./actors.js?v=2.3",
          "./journey-transfer.js": "./journey-transfer.js?v=2.3",
          "./game.js": "./game.js?v=2.3",
          "./ink.js": "./ink.js?v=2.3",
          "./interface.js": "./interface.js?v=2.3",
          "./terrain.js": "./terrain.js?v=2.3",
          "./world.js": "./world.js?v=2.3"
        }
      }
    </script>
  </head>
  <body>
    <main id="stage">
      <canvas
        id="scene"
        tabindex="0"
        aria-label="3Dのゲーム画面。矢印で前後左右に移動、Spaceでジャンプ、ドラッグで周囲を見回す。"
      ></canvas>
      <header class="top">
        <div class="headleft">
          <a class="circle" href="../" aria-label="作品選択へ" title="作品選択へ"
            ><i data-glyph="back"></i
          ></a>
          <div class="wordmark">
            <span>Mochi Quest <b>2</b></span
            ><small>鳥獣戯画　四季十景巡り</small>
          </div>
        </div>
        <div class="course" title="カメラの方角">
          <span class="course-point"></span>
          <div id="compass"></div>
        </div>
        <nav aria-label="旅の道具">
          <button class="circle" id="map" aria-label="地図" title="地図（M）">
            <i data-glyph="map"></i>
          </button>
          <button
            class="circle"
            id="photo"
            aria-label="お顔カメラ"
            title="お顔カメラ（C）"
            aria-pressed="false"
          >
            <i data-glyph="camera"></i>
          </button>
          <button class="circle" id="audio" aria-label="音の切り替え"><i data-glyph="volume"></i></button>
          <button class="circle" id="guide" aria-label="遊び方・一時停止" title="遊び方・一時停止（Esc）">
            <i data-glyph="menu"></i>
          </button>
        </nav>
      </header>
      <div id="target" hidden></div>
      <div class="place">
        <span><i></i>現在地</span>
        <h1 id="region">桜川の渡し</h1>
      </div>
      <div id="toast" role="status" hidden></div>
      <div id="speech" hidden></div>
      <div class="touch" id="touch">
        <div id="stick" aria-label="移動スティック"><b></b></div>
        <div class="hands">
          <button id="send" aria-label="三条通知"><i data-glyph="notice"></i></button
          ><button id="leap" aria-label="ジャンプ"><i data-glyph="jump"></i></button>
        </div>
      </div>
      <div class="hud-player">
        <div class="hud-top">
          <canvas id="face" width="70" height="70" aria-label="お餅の表情"></canvas>
          <div class="bars">
            <div class="bar-row">
              <b>HP</b><span><i id="hp-bar"></i></span><output id="hp">100</output>
            </div>
            <div class="bar-row">
              <b>MP</b><span><i id="mp-bar"></i></span><output id="mp">100</output>
            </div>
          </div>
        </div>
        <div class="pockets">
          <span><i data-glyph="notice"></i>通知点 <strong id="score">0</strong></span
          ><span><i data-glyph="stamp"></i>御朱印 <strong id="visits">1/10</strong></span>
        </div>
      </div>
      <div id="effects" aria-live="polite"></div>
      <button id="context" hidden><kbd>E</kbd> <span></span></button>
      <div class="mode-dock">
        <div class="dock-label">餅モード</div>
        <div id="modes"></div>
      </div>
      <button id="mini-button" aria-label="絵巻地図を開く">
        <canvas id="minimap" width="180" height="180"></canvas>
      </button>
      <div class="keyline">
        <span><kbd>WASD</kbd> 移動</span><span><kbd>Space</kbd> 跳ぶ・連打で伸びる</span
        ><span><kbd>Z</kbd> 三条通知</span><span><kbd>E</kbd> 乗降・調べる</span
        ><span>ドラッグで見回す</span>
      </div>
      <div id="photo-dock" hidden>
        <div id="emotes" aria-label="表情を選ぶ"></div>
        <div class="photo-actions">
          <button id="download"><i data-glyph="camera"></i> 写真を保存</button
          ><button id="leave-photo">旅に戻る</button>
        </div>
      </div>
      <div id="loading" role="status">
        <img src="../assets/ui/seal.svg" alt="" /><span id="loading-copy">絵巻をひらいています…</span
        ><a href="../" hidden id="load-back">作品選択へ</a>
      </div>
    </main>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="sheet">
        <header>
          <h2 id="dialog-title"></h2>
          <button id="dismiss" class="circle" aria-label="閉じる"><i data-glyph="close"></i></button>
        </header>
        <div id="dialog-content"></div>
      </div>
    </dialog>
    <script type="module" src="./main.js?v=2.3"></script>
    <noscript>JavaScript を有効にして遊んでください。</noscript>
  </body>
</html>
