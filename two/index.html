    <script>
      if (location.hash.startsWith('#mochi2=')) {
        window.pendingMochiJourney = location.hash;
        history.replaceState(history.state, '', location.pathname + location.search);
      }
      // Opening a transfer link while this game is already on screen can be
      // a same-document navigation. Run the usual validated startup in that case.
      window.addEventListener('hashchange', () => {
        if (location.hash.startsWith('#mochi2=')) location.reload();
      });
    </script>

    <script type="module">
      const loading = document.getElementById('loading');
      for (const child of loading.parentElement.children) child.inert = child !== loading;
      document.getElementById('load-retry').onclick = () => {
        if (window.pendingMochiJourney) history.replaceState(history.state, '', window.pendingMochiJourney);
        location.reload();
      };
      import('./main.js?v=delivery-animal-scale-1').catch(error => {
        console.error('Mochi Quest 2', error);
        document.getElementById('loading-copy').textContent = error.name === 'WebGLUnavailableError'
          ? 'WebGL 2 を開始できませんでした。ブラウザのグラフィック設定を確認して、読み込み直してください。'
          : '絵巻の読み込みが途中で止まりました。もう一度、読み込み直してください。';
        document.getElementById('load-actions').hidden = false;
        loading.hidden = false;
      });
    </script>
