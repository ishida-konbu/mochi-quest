    <link rel="modulepreload" href="./vendor/three.module.min.js" />
    <link rel="modulepreload" href="./main.js?v=emaki-funatabi-1" />
  </head>
  <body>
    <main id="stage">
      <canvas
        id="scene"
        tabindex="0"
        aria-label="3Dのゲーム画面。矢印で前後左右に移動、Spaceでジャンプ。泳ぐときは下キーで手前へ、Spaceと下キーで潜水。Spaceだけで水中では浮上、水面ではジャンプ。ドラッグで周囲を見回す。"
      ></canvas>
      <header class="top">
        <div class="headleft">
          <a class="circle" href="../" aria-label="作品選択へ" title="作品選択へ"
            ><i data-glyph="back"></i
          ></a>
          <div class="wordmark">
            <span>Mochi Quest <b>2</b></span
            ><small>鳥獣戯画　十七景もち寄り帖</small>
          </div>
        </div>
        <div class="course" title="カメラの方角">
          <span class="course-point"></span>
          <div id="compass"></div>
        </div>
        <nav aria-label="旅の道具">
          <button class="circle" id="map" aria-label="地図" title="地図（M）">
            <i data-glyph="map"></i>
          </button>
          <button
            class="circle"
            id="photo"
            aria-label="お顔カメラ"
            title="お顔カメラ（C）"
            aria-pressed="false"
          >
            <i data-glyph="camera"></i>
          </button>
          <button class="circle" id="audio" aria-label="音の切り替え"><i data-glyph="volume"></i></button>
          <button type="button" class="circle" id="audio-settings-toggle" title="音量設定"
            aria-label="音量設定" aria-expanded="false" aria-haspopup="dialog" aria-controls="audio-settings">
            <i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7h4m6 0h8M3 17h9m6 0h3"/><circle cx="10" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></i>
          </button>
          <button class="circle" id="guide" aria-label="遊び方・一時停止" title="遊び方・一時停止（Esc）">
            <i data-glyph="menu"></i>
          </button>
        </nav>
      </header>
      <button id="story-book" aria-label="頼まれごとと手掛かりの帳面を開く（J）" title="帳面を開く（J）">
        <span class="book-stitch" aria-hidden="true"></span><small id="story-volume">第一話</small>
        <strong id="story-title">十二個目の桜餅</strong><span class="book-turn" aria-hidden="true">›</span>
      </button>
      <div id="target" hidden></div>
      <div class="place">
        <span><i></i>現在地</span>
        <h1 id="region">桜川の渡し</h1>
      </div>
      <div id="toast" role="status" hidden></div>
      <div id="speech" hidden></div>
      <div class="touch" id="touch">
        <div id="stick" aria-label="移動スティック"><b></b></div>
        <div class="hands">
          <button id="dive" aria-label="長押しで潜る" hidden>潜る</button>
          <button id="send" aria-label="三条通知"><i data-glyph="notice"></i></button
          ><button id="leap" aria-label="ジャンプ"><i data-glyph="jump"></i></button>
        </div>
      </div>
      <section class="hud-player" aria-label="旅の記録">
        <div class="hud-top">
          <canvas id="face" width="112" height="100" aria-label="お餅の表情"></canvas>
          <div class="bars">
            <div class="bar-row">
              <b>HP</b><span><i id="hp-bar"></i></span><output id="hp" aria-label="体力">100</output>
            </div>
            <div class="bar-row">
              <b>MP</b><span><i id="mp-bar"></i></span><output id="mp" aria-label="モッチポイント">100</output>
            </div>
          </div>
        </div>
        <dl class="pockets">
          <div><dt><i data-glyph="notice"></i>通知点</dt><dd id="score">0</dd></div>
          <div><dt><i data-glyph="stamp"></i>御朱印</dt><dd id="visits">1 / 17</dd></div>
        </dl>
        <button id="journal" title="配達帳を開く"><span>配達帳</span><strong id="delivered-count">0 / 876</strong><i data-glyph="open-book"></i></button>
        <div id="effects" aria-live="polite"></div>
      </section>
      <button id="context" hidden><kbd>E</kbd> <span></span></button>
      <div class="mode-dock" role="group" aria-label="餅モード">
        <div class="dock-label">変身</div>
        <div id="modes"></div>
      </div>
      <button id="mini-button" aria-label="絵巻地図を開く">
        <canvas id="minimap" width="180" height="180"></canvas>
      </button>
      <div class="keyline">
        <span><kbd>WASD</kbd> 移動</span><span><kbd>Space</kbd> <span id="space-hint">跳ぶ・連打で伸びる</span></span
        ><span><kbd>Z</kbd> 三条通知</span><span><kbd>E</kbd> 乗降・調べる</span
        ><span>ドラッグで見回す</span>
      </div>
      <div id="photo-dock" hidden>
        <div id="emotes" aria-label="表情を選ぶ"></div>
        <div class="photo-actions">
          <button id="download"><i data-glyph="camera"></i> 写真を保存</button
          ><button id="leave-photo">旅に戻る</button>
        </div>
      </div>
      <div id="loading" role="status">
        <div class="loading-folio">
          <p lang="en">MOCHI QUEST <b>II</b></p>
          <h2>十七景もち寄り帖</h2>
          <img src="./assets/world/mochiyori-frontispiece.webp" alt="桜の下で籠をのぞく兎と蛙" />
          <span id="loading-copy">絵巻をひらいています…</span>
        </div><a href="../" hidden id="load-back">作品選択へ</a>
      </div>
    </main>
    <section id="audio-settings" role="dialog" aria-labelledby="audio-settings-title" hidden>
      <header>
        <h2 id="audio-settings-title">音量設定</h2>
        <button type="button" id="audio-settings-close" class="circle" aria-label="音量設定を閉じる"><i data-glyph="close"></i></button>
      </header>
      <p id="audio-muted" hidden>全体の音は消音中です。</p>
      <div class="volume-row">
        <label for="volume-effects">効果音</label>
        <input id="volume-effects" data-channel="effects" type="range" min="0" max="100" value="100">
        <output for="volume-effects" aria-hidden="true">100%</output>
      </div>
      <div class="volume-row">
        <label for="volume-ambient">環境音</label>
        <input id="volume-ambient" data-channel="ambient" type="range" min="0" max="100" value="100">
        <output for="volume-ambient" aria-hidden="true">100%</output>
      </div>
      <div class="volume-row">
        <label for="volume-music">BGM</label>
        <input id="volume-music" data-channel="music" type="range" min="0" max="100" value="100">
        <output for="volume-music" aria-hidden="true">100%</output>
      </div>
      <details id="soundtrack">
        <summary>曲とエリアの一覧</summary>
        <table>
          <thead><tr><th scope="col">エリア・場面</th><th scope="col">曲名・アーティスト</th></tr></thead>
          <tbody></tbody>
        </table>
      </details>
    </section>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="sheet">
        <header>
          <h2 id="dialog-title"></h2>
          <button id="dismiss" class="circle" aria-label="閉じる"><i data-glyph="close"></i></button>
        </header>
        <div id="dialog-content"></div>
      </div>
    </dialog>
    <script type="module" src="./main.js?v=emaki-funatabi-1"></script>
    <noscript>JavaScript を有効にして遊んでください。</noscript>
  </body>
</html>
