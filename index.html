<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f1e5" />
    <title>Mochi Quest ｜ 作品選択</title>
    <meta
      name="description"
      content="お餅になって鳥獣戯画の世界を旅しよう。3Dの六景巡りと、横にひらく絵巻道中から選べます。"
    />
    <link rel="icon" type="image/svg+xml" href="./assets/ui/seal.svg" />
    <link rel="stylesheet" href="./library.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="masthead">
        <a class="brand" href="./" aria-label="Mochi Quest 作品選択"
          ><img src="./assets/ui/seal.svg" width="45" height="45" alt="" />
          <div>
            <h1>Mochi Quest</h1>
            <span>鳥獣戯画道中記</span>
          </div></a
        >
        <a class="account" href="https://github.com/ishida-konbu"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.87c-2.78.6-3.37-1.18-3.37-1.18-.46-1.16-1.12-1.47-1.12-1.47-.91-.62.07-.61.07-.61 1.01.07 1.53 1.04 1.53 1.04.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.64-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.11-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.03A9.55 9.55 0 0 1 12 6.84c.85 0 1.71.12 2.51.34 1.91-1.3 2.75-1.03 2.75-1.03.55 1.38.21 2.4.11 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.86v2.73c0 .26.18.58.69.48A10 10 0 0 0 12 2Z"
            /></svg
          >ishida-konbu</a
        >
      </header>
      <main>
        <div class="shelf-heading">
          <h2>作品を選ぶ</h2>
          <span></span>
        </div>
        <div class="library">
          <a href="./two/?v=2.1" class="game-card next" aria-label="Mochi Quest 2 を遊ぶ"
            ><div class="cover">
              <img
                src="./assets/covers/two.webp?v=2.1"
                alt="墨描きの山々を背に、桜川のほとりにたたずむ白いお餅"
                fetchpriority="high"
              /><span class="genre">3D オープンワールド</span>
            </div>
            <div class="caption">
              <div>
                <h3>Mochi Quest <b>2</b></h3>
                <h4>六景巡り</h4>
              </div>
              <span class="play"><i></i>遊ぶ</span>
            </div>
            <p>橋を渡り、山道を登り、六つの名所で御朱印を集める。お餅の目線で巡る立体の里。</p></a
          >
          <a href="./one/" class="game-card first" aria-label="Mochi Quest 1 を遊ぶ"
            ><div class="cover">
              <img
                src="./assets/covers/one.webp"
                alt="川辺の絵巻で、荷を担ぐうさぎや相撲を取るカエルと出会うお餅"
              /><span class="genre">横スクロール</span>
            </div>
            <div class="caption">
              <div>
                <h3>Mochi Quest <b>1</b></h3>
                <h4>絵巻道中</h4>
              </div>
              <span class="play"><i></i>遊ぶ</span>
            </div>
            <p>荷運びのうさぎに三条通知をひと投げ。墨絵の道をもっちり歩く、はじまりの旅。</p></a
          >
        </div>
      </main>
      <footer>
        <span class="line"></span><span class="end-seal" aria-hidden="true">餅</span
        ><span class="line"></span>
      </footer>
    </div>
  </body>
</html>
