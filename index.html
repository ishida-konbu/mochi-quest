<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efdf">
<meta name="description" content="お餅になって鳥獣戯画の世界を旅する、絵巻のオープンワールドゲーム。">
<title>Mochi Quest ｜ 鳥獣戯画道中記</title>
<link rel="icon" href="./assets/ui/seal.svg" type="image/svg+xml">
<link rel="preload" as="image" href="./assets/landscape/river.webp">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="shell">
<header class="mast">
  <div class="brand"><img src="./assets/ui/seal.svg" alt="" width="46" height="46"><div><h1>Mochi Quest</h1><p>鳥獣戯画道中記</p></div></div>
  <nav class="tools" aria-label="旅の道具">
    <button class="map-tool" id="map-button"><i data-icon="map"></i><span>絵巻地図</span></button>
    <button id="help-button" title="遊び方（H）" aria-label="遊び方"><i data-icon="book"></i><span>遊び方</span></button>
    <button id="mobile-pause" aria-label="一時停止"><i data-icon="pause"></i></button>
    <span class="divider"></span>
    <button class="icon-button" id="sound" title="音を切る" aria-label="音を切る" aria-pressed="true"><i data-icon="sound"></i></button>
    <button class="icon-button" id="fullscreen" title="全画面表示" aria-label="全画面表示"><i data-icon="fullscreen"></i></button>
  </nav>
</header>
<main>
<div class="scroll-frame">
<section id="stage" class="stage" aria-label="鳥獣戯画の世界">
  <canvas id="backdrop" aria-hidden="true"></canvas>
  <canvas id="world" tabindex="0" aria-label="Mochi Quest のゲーム画面。矢印で移動、スペースでジャンプ、Zで三条通知。"></canvas>
  <div class="status-panel">
    <div class="player-emblem"><canvas id="portrait" width="100" height="100" aria-hidden="true"></canvas></div>
    <div class="vitals">
      <div class="meter-row hp"><b>HP</b><div class="meter"><i id="hp-meter"></i></div><output id="hp" aria-label="HP">100</output></div>
      <div class="meter-row mp"><b>MP</b><div class="meter"><i id="mp-meter"></i></div><output id="mp" aria-label="MP">100</output></div>
    </div>
  </div>
  <div id="buffs" class="buffs"></div>
  <div class="place"><div class="chapter"><i></i><span id="chapter">第一景</span><i></i></div><div id="place">桜川の渡し</div></div>
  <div id="score-tag" class="score-tag" aria-label="三条通知の得点"><i data-icon="letter"></i><span>通知点</span><strong id="score">0</strong></div>
  <div id="speech" class="speech" hidden></div>
  <div id="message" class="message" role="status" hidden></div>
  <button id="context" class="context" hidden><kbd>E</kbd><span></span></button>
  <div class="touch-controls" aria-label="タッチ操作">
    <div class="pad" aria-label="移動スティック"><span></span><b></b></div>
    <div class="touch-actions"><button id="touch-throw" aria-label="三条通知"><i data-icon="letter"></i></button><button id="touch-jump" aria-label="ジャンプ"><i data-icon="jump"></i></button></div>
  </div>
</section>
</div>
<section class="modes" aria-labelledby="modes-heading">
  <div class="mode-caption"><div class="caption-line"><i></i><span>変化の術</span></div><h2 id="modes-heading">餅モード</h2></div>
  <div id="mode-list" class="mode-list"></div>
</section>
</main>
<footer class="controls">
  <div class="legend">
    <span><kbd>←</kbd><kbd>→</kbd> 移動</span><span class="depth-key"><kbd>↑</kbd><kbd>↓</kbd> 奥行き</span><span><kbd>Space</kbd> ジャンプ</span><span><kbd>Z</kbd> 三条通知</span><span><kbd>E</kbd> 調べる・乗降</span>
  </div>
  <div class="touch-legend">左スティックで移動 ・ 右ボタンで通知とジャンプ</div>
  <button id="pause" title="一時停止（P）"><i data-icon="pause"></i>一時停止</button>
</footer>
</div>
<dialog id="panel" aria-labelledby="panel-title"><div class="dialog-paper">
  <div class="dialog-head"><div><div id="panel-sub" class="caption-line"><i></i><span></span></div><h2 id="panel-title"></h2></div><button id="close" class="close" aria-label="閉じる"><i data-icon="close"></i></button></div>
  <div id="panel-body"></div>
</div></dialog>
<noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
<script type="module" src="./main.js"></script>
</body></html>
